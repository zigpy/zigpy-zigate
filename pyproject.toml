[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[project]
name = "zigpy-zigate"
dynamic = ["version"]
description = "A library which communicates with ZiGate radios for zigpy"
urls = {repository = "https://github.com/zigpy/zigpy-zigate"}
authors = [
    {name = "Sébastien RAMAGE", email = "sebatien.ramage@gmail.com"}
]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "voluptuous",
    "zigpy>=1.3.0",
    "pyusb>=1.1.0",
    "gpiozero",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "tools", "tools.*"]

[project.optional-dependencies]
testing = [
    "pytest>=7.1.2",
    "pytest-asyncio>=0.19.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.8.2",
    "pytest-cov>=3.0.0",
]

[tool.setuptools-git-versioning]
enabled = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "C", # complexity
    "E", # pycodestyle
    "F", # pyflakes/autoflake
    "I", # isort
    "SIM", # flake8-simplify
    "UP", # pyupgrade
    "W", # pycodestyle
    "YTT", # flake8-2020
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401", "F403"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["zigpy_zigate", "tests"]
forced-separate = ["tests"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
# zigpy's integer and struct constructors are unannotated, which would make
# every zigpy type construction an "untyped call"
untyped_calls_exclude = ["zigpy.types"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unreachable = true
show_error_codes = true
show_error_context = true
error_summary = true
exclude = ["^tests/"]

# Per-module error-code suppressions below are regenerated by
# `python -m tools.regenerate_mypy_ignores`. They are sorted easiest-to-fix
# first; clean up a module's errors and re-run the tool to shrink the list.
# Autogenerated mypy overrides: start
# Total ignored errors: 109 across 5 modules
[[tool.mypy.overrides]]
module = "zigpy_zigate.tools.cli"
disable_error_code = [
    "attr-defined",  # 1
]

[[tool.mypy.overrides]]
module = "zigpy_zigate.zigbee.application"
disable_error_code = [
    "attr-defined",  # 1
]

[[tool.mypy.overrides]]
module = "zigpy_zigate.api"
disable_error_code = [
    "attr-defined",  # 3
    "no-any-return",  # 1
]

[[tool.mypy.overrides]]
module = "zigpy_zigate.common"
disable_error_code = [
    "misc",  # 1
    "no-untyped-call",  # 4
    "no-untyped-def",  # 3
]

[[tool.mypy.overrides]]
module = "zigpy_zigate.tools.flasher"
disable_error_code = [
    "no-untyped-call",  # 55
    "no-untyped-def",  # 40
]
# Autogenerated mypy overrides: end

[tool.pytest.ini_options]
asyncio_mode = "auto"
